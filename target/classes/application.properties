spring.application.name=foodrescue
# Port 8080 is commonly taken by other local services (e.g. an Oracle DB listener), so 8081 is used instead.
server.port=8081

# ---------- Database (H2, runs inside the application, no install needed) ----------
spring.datasource.url=jdbc:h2:mem:foodrescue;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates the tables from the entity classes on start-up
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Web console of the database: http://localhost:8081/h2-console
# (JDBC URL: jdbc:h2:mem:foodrescue, user: sa, no password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- Application settings ----------
# How often the background job looks for food past its best-before date (ms)
app.expiry-sweep-rate-ms=60000

# ---------- Logging ----------
logging.level.com.example.foodrescue=INFO
